<text x="96" y="923" font-size="12" text-anchor="start" fill="#333" font-weight="normal">5 V</text>
<line x1="50" y1="940" x2="86" y2="940" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/>
<text x="96" y="945" font-size="12" text-anchor="start" fill="#333" font-weight="normal">GND</text>
<text x="190" y="830" font-size="14" text-anchor="start" fill="#111" font-weight="bold">接线要点</text>
<text x="190" y="854" font-size="12" text-anchor="start" fill="#333" font-weight="normal">1. 屏幕、按键、雷达、舵机都要与主控共地；按键低电平有效，固件已开内部上拉，不要再外接上拉电阻。</text>
<text x="190" y="874" font-size="12" text-anchor="start" fill="#333" font-weight="normal">2. 默认 auto / screen 配置：K1 K2 K3 = GPIO6 / 10 / 11，不初始化舵机 PWM。</text>
<text x="190" y="894" font-size="12" text-anchor="start" fill="#333" font-weight="normal">3. robot 配置（重启后生效）：只扫描 K1（GPIO6）；GPIO10 改给舵机信号线，GPIO10 / 11 的按键不再扫描。</text>
<text x="190" y="914" font-size="12" text-anchor="start" fill="#333" font-weight="normal">4. GPIO10 二选一：接 K2，或接舵机信号线，不能同时接。</text>
<text x="190" y="934" font-size="12" text-anchor="start" fill="#333" font-weight="normal">5. LD2450 的 TX 接 GPIO20，RX 接 GPIO21（交叉相接）；ROM 启动日志仍可能出现在 GPIO21，所以它只接雷达 RX，不能改接舵机。</text>
<text x="190" y="954" font-size="12" text-anchor="start" fill="#333" font-weight="normal">6. 雷达、舵机的 5V 取自 USB 的 5V / VBUS，不从 3V3 取电。整机峰值电流是否能被电脑 USB 口承受，尚待实测。</text>
</svg>
