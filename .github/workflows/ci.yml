name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile Python sources
        run: python3 -m py_compile host/esphookd.py host/install_hooks.py host/hooks/esphook_notify_hook.py
      - name: Run hook tests
        run: python3 host/test_hooks.py
      - name: Run device-link tests
        run: python3 host/test_device_link.py
      - name: Check hook installer
        run: ./scripts/install-hooks.sh --tools all --dry-run --home "$RUNNER_TEMP/esphook-hook-dry-run"
      - name: Check one-click installer and release packager
        run: |
          bash -n install.sh
          bash -n scripts/package-release.sh
          ./install.sh --help
      - name: Check patch whitespace
        run: git diff --check

  firmware:
    name: ESP32-C3 firmware
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: espressif/idf:v5.5.4
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Build firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32c3
          idf.py build
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esphook-firmware
          if-no-files-found: error
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/supermini-aihook.bin
            build/flasher_args.json
            build/flash_args
            build/config/sdkconfig.json
      - name: Upload fixed font resource
        uses: actions/upload-artifact@v4
        with:
          name: esphook-full-flash-resources
          if-no-files-found: error
          path: |
            main/fontdata.bin
            partitions_aihook.csv
            dependencies.lock

  release:
    name: GitHub Release
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: esphook-*
          path: release-input
          merge-multiple: false
      - name: Package release assets
        run: scripts/package-release.sh release-input dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.0.0-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "esphook $RELEASE_TAG" \
            --latest \
            --generate-notes \
            dist/esphook-host.tar.gz \
            dist/esphook-firmware.bin \
            dist/esphook-full-flash.zip \
            dist/SHA256SUMS
