name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test dependencies (cJSON for the protocol tests, Pillow for the mirror tool)
        run: |
          sudo apt-get update && sudo apt-get install -y libcjson-dev
          python3 -m pip install pillow
      - name: Fetch pinned LVGL for application rendering tests
        run: git clone --depth 1 --branch v9.5.0 https://github.com/lvgl/lvgl.git "$RUNNER_TEMP/lvgl"
      - name: Run every host check (scripts/check-all.sh)
        env:
          CHECK_STRICT: "1"
          LVGL_SOURCE_DIR: ${{ runner.temp }}/lvgl
          APP_UI_BUILD_DIR: ${{ runner.temp }}/app-ui-build
        run: ./scripts/check-all.sh
      - name: Upload UI test frames
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: esphook-ui-test-frames
          path: ${{ runner.temp }}/app-ui-build/frames

  firmware:
    name: ESP32-C3 firmware
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: espressif/idf:v5.5.4
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Build firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32c3
          idf.py build
      - name: Size budget (fails when less than 8% of the OTA slot is free)
        run: python3 scripts/size-report.py --bin build/supermini-aihook.bin --map build/supermini-aihook.map --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload linker map
        uses: actions/upload-artifact@v4
        with:
          name: size-map
          retention-days: 14
          path: build/supermini-aihook.map
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esphook-firmware
          if-no-files-found: error
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/supermini-aihook.bin
            build/flasher_args.json
            build/flash_args
            build/config/sdkconfig.json
      - name: Upload fixed font resource
        uses: actions/upload-artifact@v4
        with:
          name: esphook-full-flash-resources
          if-no-files-found: error
          path: |
            main/fontdata.bin
            partitions_aihook.csv
            dependencies.lock

  packages:
    name: Release packages
    needs: [firmware, host-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: esphook-*
          path: release-input
          merge-multiple: false
      - name: Package release assets
        run: scripts/package-release.sh release-input dist
      - name: Upload complete release packages
        uses: actions/upload-artifact@v4
        with:
          name: esphook-release-packages
          if-no-files-found: error
          path: dist/*

  release:
    name: GitHub Release
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Download verified release packages
        uses: actions/download-artifact@v4
        with:
          name: esphook-release-packages
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < version.txt)"
          release_tag="v${version}-${GITHUB_RUN_NUMBER}"
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" --draft --target "$GITHUB_SHA" \
              --title "esphook universal ${version}" --notes-file dist/RELEASE_NOTES.md
          fi
          gh release upload "$release_tag" --clobber \
            dist/esphook-kit.zip \
            dist/esphook-sdk.zip \
            dist/esphook-host.tar.gz \
            dist/esphook-firmware.bin \
            dist/esphook-full-flash.zip \
            dist/release.json \
            dist/SHA256SUMS
          gh release edit "$release_tag" --draft=false --latest \
            --title "esphook universal ${version}" --notes-file dist/RELEASE_NOTES.md
