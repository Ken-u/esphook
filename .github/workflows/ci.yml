name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile Python sources
        run: python3 -m compileall -q apps framework/pc host scripts tests
      - name: Validate app manifests and developer tooling
        run: |
          python3 scripts/check-apps.py
          python3 tests/test_scaffold.py
          python3 tests/test_app_sdk.py
          cmake -P tests/test_cmake_scan.cmake
          python3 tests/test_release_package.py
      - name: Test PC stock replay, data preparation and USB transport
        run: python3 apps/stock/pc/test_stock_t.py
      - name: Run hook tests
        run: python3 apps/hook/pc/test_hooks.py
      - name: Run device-link tests
        run: python3 apps/hook/pc/test_device_link.py
      - name: Test robot parser and follow controller
        run: ./scripts/test-robot.sh
      - name: Test GPIO6 basketball game
        run: ./scripts/test-basketball.sh
      - name: Test dino runner game
        run: ./scripts/test-dino.sh
      - name: Test ski game
        run: ./scripts/test-ski.sh
      - name: Test wooden fish counter
        run: ./scripts/test-muyu.sh
      - name: Test servo shake and radar steering helpers
        run: ./scripts/test-haptic-steer.sh
      - name: Test aquarium simulation
        run: ./scripts/test-aquarium.sh
      - name: Test fishing game rules
        run: ./scripts/test-fishing.sh
      - name: Test starship game
        run: ./scripts/test-starship.sh
      - name: Test racing game
        run: ./scripts/test-racing.sh
      - name: Test wall-clock maths
        run: ./scripts/test-app-time.sh
      - name: Test shared app maths, random and fixed steps
        run: ./scripts/test-app-util.sh
      - name: Test lucky slip game
        run: ./scripts/test-fortune.sh
      - name: Test framework alarm registry
        run: ./scripts/test-app-alarm.sh
      - name: Test alarm clock app settings and entries
        run: ./scripts/test-alarm.sh
      - name: Test gold miner game
        run: ./scripts/test-miner.sh
      - name: Test jump game
        run: ./scripts/test-jump.sh
      - name: Test zombie shooter
        run: ./scripts/test-zombie.sh
      - name: Test screen mirror strip codec and ring
        run: ./scripts/test-mirror.sh
      - name: Install Pillow for the screen mirror PC tool
        run: python3 -m pip install pillow
      - name: Test screen mirror PC tool and protocol against the firmware parser
        run: python3 apps/mirror/pc/test_mirror.py
      - name: Test universal hardware profiles and optional-driver failure handling
        run: ./scripts/test-hardware.sh
      - name: Install UI protocol test dependency
        run: sudo apt-get update && sudo apt-get install -y libcjson-dev
      - name: Test display protocol and radar view
        run: ./scripts/test-robot-ui.sh
      - name: Test launcher, global input, game protocol and navigation
        run: ./scripts/test-app-games.sh
      - name: Test USB TX framing and ack-loss reporting
        run: ./scripts/test-usb-cdc.sh
      - name: Test real-time keyboard bridge
        run: python3 apps/key_report/pc/test_bridge.py
      - name: Fetch pinned LVGL for application rendering tests
        run: git clone --depth 1 --branch v9.5.0 https://github.com/lvgl/lvgl.git "$RUNNER_TEMP/lvgl"
      - name: Test every app with real LVGL and a 64KB UI heap
        env:
          LVGL_SOURCE_DIR: ${{ runner.temp }}/lvgl
          APP_UI_BUILD_DIR: ${{ runner.temp }}/app-ui-build
        run: ./scripts/test-app-ui.sh
      - name: Upload UI test frames
        uses: actions/upload-artifact@v4
        with:
          name: esphook-ui-test-frames
          path: ${{ runner.temp }}/app-ui-build/frames
      - name: Check hook installer
        run: ./scripts/install-hooks.sh --tools all --dry-run --home "$RUNNER_TEMP/esphook-hook-dry-run"
      - name: Check one-click installer and release packager
        run: |
          bash -n install.sh
          bash -n scripts/package-release.sh
          bash -n scripts/stock-t.sh
          ./scripts/stock-t.sh --demo --dry-run
          python3 apps/demo/pc/main.py --dry-run
          python3 apps/alarm/pc/main.py --dry-run
          python3 apps/key_report/pc/main.py --dry-run
          python3 apps/key_report/pc/bridge.py --dry-run
          ./install.sh --help
      - name: Check patch whitespace
        run: git diff --check

  firmware:
    name: ESP32-C3 firmware
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: espressif/idf:v5.5.4
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Build firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32c3
          idf.py build
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esphook-firmware
          if-no-files-found: error
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/supermini-aihook.bin
            build/flasher_args.json
            build/flash_args
            build/config/sdkconfig.json
      - name: Upload fixed font resource
        uses: actions/upload-artifact@v4
        with:
          name: esphook-full-flash-resources
          if-no-files-found: error
          path: |
            main/fontdata.bin
            partitions_aihook.csv
            dependencies.lock

  firmware-legacy:
    name: ESP32-C3 legacy hook firmware
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: espressif/idf:v5.5.4
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Build with robot disabled
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          printf '# CONFIG_DESKTOP_FOLLOW_ROBOT is not set\n' > sdkconfig.legacy.defaults
          idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.legacy.defaults" set-target esp32c3
          idf.py build

  packages:
    name: Release packages
    needs: [firmware, firmware-legacy, host-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: esphook-*
          path: release-input
          merge-multiple: false
      - name: Package release assets
        run: scripts/package-release.sh release-input dist
      - name: Upload complete release packages
        uses: actions/upload-artifact@v4
        with:
          name: esphook-release-packages
          if-no-files-found: error
          path: dist/*

  release:
    name: GitHub Release
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Download verified release packages
        uses: actions/download-artifact@v4
        with:
          name: esphook-release-packages
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < version.txt)"
          release_tag="v${version}-${GITHUB_RUN_NUMBER}"
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" --draft --target "$GITHUB_SHA" \
              --title "esphook universal ${version}" --notes-file dist/RELEASE_NOTES.md
          fi
          gh release upload "$release_tag" --clobber \
            dist/esphook-kit.zip \
            dist/esphook-sdk.zip \
            dist/esphook-host.tar.gz \
            dist/esphook-firmware.bin \
            dist/esphook-full-flash.zip \
            dist/release.json \
            dist/SHA256SUMS
          gh release edit "$release_tag" --draft=false --latest \
            --title "esphook universal ${version}" --notes-file dist/RELEASE_NOTES.md
